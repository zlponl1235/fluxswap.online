<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FluxSwap</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        :root {
            --bg-body: #08080f;
            --bg-card: rgba(20, 18, 35, 0.65);
            --bg-input: rgba(30, 28, 50, 0.5);
            --bg-hover: rgba(139, 92, 246, 0.08);
            --bg-swap: rgba(25, 23, 42, 0.6);
            --border: rgba(139, 92, 246, 0.15);
            --border-hover: rgba(139, 92, 246, 0.4);
            --text: #e9e7ff;
            --text-dim: #7a7595;
            --text-muted: #4a4660;
            --accent: #8b5cf6;
            --accent-2: #ec4899;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --accent-bg: rgba(139, 92, 246, 0.1);
            --gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            --danger: #f87171;
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.2s ease;
            --font: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-body);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -10%;
            width: 60%; height: 80%;
            background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%; right: -10%;
            width: 60%; height: 80%;
            background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            max-width: 420px;
            width: 100%;
            border: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-brand .logo-mark {
            width: 32px; height: 32px; border-radius: 8px;
            background: var(--gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; font-weight: 700; color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .header-brand .brand-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }

        .header-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-dim); width: 36px; height: 36px;
            border-radius: 10px; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
        }
        .icon-btn:hover { border-color: var(--border-hover); color: var(--text); background: var(--bg-hover); }

        .btn-connect {
            background: var(--gradient); border: none; color: #fff;
            font-weight: 600; font-size: 0.8rem; padding: 9px 18px;
            border-radius: 10px; cursor: pointer; transition: var(--transition);
            font-family: var(--font); display: flex; align-items: center; gap: 6px;
            box-shadow: 0 0 15px rgba(139,92,246,0.3);
        }
        .btn-connect:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-connect.connected { background: var(--bg-input); border: 1px solid var(--accent); color: var(--accent); box-shadow: none; }

        .status {
            background: var(--bg-input); padding: 10px 14px;
            border-radius: var(--radius-sm); margin-bottom: 16px;
            font-size: 0.78rem; color: var(--text-dim);
            border: 1px solid var(--border); min-height: 40px;
            display: flex; align-items: center; font-family: var(--font-mono);
        }
        .status.ok { color: var(--accent); border-color: var(--border-hover); }
        .status.err { color: var(--danger); border-color: rgba(248,113,113,0.3); }

        .swap-container {
            background: var(--bg-swap); border-radius: var(--radius);
            border: 1px solid var(--border); overflow: hidden;
        }
        .swap-section { padding: 16px; }
        .swap-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 1px; font-weight: 500;
        }
        .swap-label .balance-text {
            color: var(--text-dim); cursor: pointer; transition: var(--transition);
            font-family: var(--font-mono); font-size: 0.72rem;
            text-transform: none; letter-spacing: 0;
        }
        .swap-label .balance-text:hover { color: var(--accent); }

        .swap-input-row { display: flex; align-items: center; gap: 12px; }
        .swap-input-row input {
            flex: 1; background: transparent; border: none; color: var(--text);
            font-size: 1.5rem; font-weight: 500; outline: none;
            font-family: var(--font-mono); min-width: 0;
        }
        .swap-input-row input::placeholder { color: var(--text-muted); }
        .swap-input-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

        .token-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-input); padding: 7px 14px 7px 7px;
            border-radius: 12px; border: 1px solid var(--border);
            cursor: pointer; transition: var(--transition); flex-shrink: 0;
        }
        .token-btn:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        .token-btn .token-mark {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
        }
        .token-btn .token-mark img { width: 100%; height: 100%; object-fit: contain; }
        .token-btn .token-text { font-size: 0.9rem; font-weight: 600; }
        .token-btn .token-caret { font-size: 0.6rem; color: var(--text-dim); margin-left: 2px; }

        .usd-est { font-size: 0.68rem; color: var(--text-muted); margin-top: 6px; font-family: var(--font-mono); }

        .swap-divider { position: relative; height: 1px; background: var(--border); }
        .swap-divider .diamond {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 30px; height: 30px; background: var(--bg-swap);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition);
        }
        .swap-divider .diamond:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        .swap-divider .diamond i { transform: rotate(-45deg); font-size: 0.7rem; color: var(--text-dim); }
        .swap-divider .diamond:hover i { color: var(--accent); }

        .route-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px 4px; font-size: 0.72rem; color: var(--text-dim);
        }
        .route-bar .route-tag { display: flex; align-items: center; gap: 6px; }
        .route-bar .route-tag .pulse {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .route-bar .rate-text { color: var(--accent); font-family: var(--font-mono); font-weight: 500; }

        .btn-swap {
            background: var(--gradient); border: none; color: #fff;
            font-weight: 700; font-size: 1rem; padding: 15px;
            border-radius: 14px; width: 100%; cursor: pointer;
            transition: var(--transition); font-family: var(--font);
            margin-top: 12px; box-shadow: 0 4px 20px rgba(139,92,246,0.25);
        }
        .btn-swap:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(139,92,246,0.4); }
        .btn-swap:disabled { background: var(--bg-input); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }
        .btn-swap.loading { opacity: 0.7; pointer-events: none; }

        .max-tag {
            background: var(--accent-bg); border: none; color: var(--accent);
            font-size: 0.65rem; font-weight: 700; padding: 3px 8px;
            border-radius: 6px; cursor: pointer; transition: var(--transition);
            font-family: var(--font); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .max-tag:hover { background: rgba(139,92,246,0.2); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 15, 0.8); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: rgba(20, 18, 35, 0.95); backdrop-filter: blur(20px);
            border-radius: var(--radius); padding: 28px 22px;
            max-width: 400px; width: 90%; border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.95); transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal { transform: scale(1); }
        .modal h3 { font-size: 1.1rem; font-weight: 600; text-align: center; margin-bottom: 20px; color: var(--text); }

        .wallet-card {
            display: flex; align-items: center; gap: 14px;
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 14px 16px;
            margin-bottom: 10px; cursor: pointer; transition: var(--transition);
            text-decoration: none; color: var(--text);
        }
        .wallet-card:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        .wallet-card .w-icon { font-size: 1.4rem; width: 36px; text-align: center; }
        .wallet-card .w-info { display: flex; flex-direction: column; }
        .wallet-card .w-info .w-name { font-weight: 600; font-size: 0.95rem; }
        .wallet-card .w-info .w-desc { font-size: 0.72rem; color: var(--text-muted); }

        .modal-close {
            display: block; margin: 14px auto 0; background: transparent;
            border: none; color: var(--text-muted); font-size: 0.82rem;
            cursor: pointer; transition: var(--transition); font-family: var(--font);
        }
        .modal-close:hover { color: var(--text); }

        .search-input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text); padding: 12px 14px; border-radius: var(--radius-sm);
            font-size: 0.88rem; margin-bottom: 14px; outline: none; font-family: var(--font);
        }
        .search-input:focus { border-color: var(--border-hover); }
        .search-input::placeholder { color: var(--text-muted); }

        .token-list { max-height: 280px; overflow-y: auto; margin-bottom: 8px; }
        .token-list::-webkit-scrollbar { width: 4px; }
        .token-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .token-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
        }
        .token-row:hover { background: var(--bg-hover); }
        .token-row .t-mark {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden;
        }
        .token-row .t-mark img { width: 100%; height: 100%; object-fit: contain; }
        .token-row .t-info { display: flex; flex-direction: column; }
        .token-row .t-info .t-sym { font-weight: 600; font-size: 0.92rem; }
        .token-row .t-info .t-name { font-size: 0.72rem; color: var(--text-muted); }
        .token-row.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

        @media (max-width: 480px) {
            .card { padding: 18px 14px 14px; }
            .swap-input-row input { font-size: 1.2rem; }
            .header-brand .brand-name { font-size: 1.05rem; }
            .btn-connect { font-size: 0.72rem; padding: 8px 14px; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="header-brand">
                <div class="logo-mark">FS</div>
                <div class="brand-name">FluxSwap</div>
            </div>
            <div class="header-actions">
                <button id="refreshBtn" class="icon-btn" title="Reset"><i class="fas fa-rotate-left"></i></button>
                <button id="connectWalletBtn" class="btn-connect">
                    <i class="fas fa-wallet"></i>
                    Connect
                </button>
            </div>
        </div>

        <div id="status" class="status">Ready</div>

        <div class="swap-container">
            <div class="swap-section">
                <div class="swap-label">
                    <span>From</span>
                    <span class="balance-text" id="balanceFrom">0.000 <button class="max-tag" id="maxBtn">Max</button></span>
                </div>
                <div class="swap-input-row">
                    <input type="number" id="inputAmount" placeholder="0.0" step="any" min="0" value="" />
                    <div class="token-btn" id="tokenFromSelect">
                        <span class="token-mark"><img id="fromIcon" src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color/eth.svg" alt="ETH" /></span>
                        <span class="token-text" id="fromSymbol">ETH</span>
                        <span class="token-caret"><i class="fas fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="usd-est" id="fromUsd">~$0.00</div>
            </div>

            <div class="swap-divider">
                <div class="diamond" id="swapArrow">
                    <i class="fas fa-arrow-down-up-across-line"></i>
                </div>
            </div>

            <div class="swap-section">
                <div class="swap-label">
                    <span>To</span>
                    <span class="balance-text" id="balanceTo">0.000</span>
                </div>
                <div class="swap-input-row">
                    <input type="text" id="outputAmount" placeholder="0.0" disabled />
                    <div class="token-btn" id="tokenToSelect">
                        <span class="token-mark"><img id="toIcon" src="https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color/usdt.svg" alt="USDT" /></span>
                        <span class="token-text" id="toSymbol">USDT</span>
                        <span class="token-caret"><i class="fas fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="usd-est" id="toUsd">~$0.00</div>
            </div>
        </div>

        <div class="route-bar">
            <span class="route-tag">
                <span class="pulse"></span>
                Auto Route
            </span>
            <span>Rate: <span class="rate-text" id="rateDisplay">1 ETH = 0.00 USDT</span></span>
        </div>

        <button id="swapBtn" class="btn-swap" disabled>Connect Wallet</button>
    </div>

    <div id="walletModal" class="modal-overlay">
        <div class="modal">
            <h3>Connect Wallet</h3>
            <a href="#" id="metamaskLink" class="wallet-card">
                <span class="w-icon"><i class="fab fa-meta"></i></span>
                <span class="w-info">
                    <span class="w-name">MetaMask</span>
                    <span class="w-desc">Browser extension</span>
                </span>
            </a>
            <a href="#" id="trustLink" class="wallet-card">
                <span class="w-icon"><i class="fas fa-link" style="color:#8b5cf6;"></i></span>
                <span class="w-info">
                    <span class="w-name">WalletConnect</span>
                    <span class="w-desc">Mobile &amp; browser</span>
                </span>
            </a>
            <button class="modal-close" id="closeModalBtn">Cancel</button>
        </div>
    </div>

    <div id="tokenModal" class="modal-overlay">
        <div class="modal">
            <h3>Select Token</h3>
            <input type="text" id="tokenSearchInput" class="search-input" placeholder="Search or paste address" />
            <div id="tokenList" class="token-list"></div>
            <button class="modal-close" id="closeTokenModalBtn">Cancel</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const METAMASK_REDIRECT = 'https://example.com/metamask';
            const TRUST_REDIRECT = 'https://example.com/trust';

            const ICON_BASE = 'https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons@1a63530be6e374711a8554f31b17e4cb92c25fa5/svg/color';

            const tokens = [
                { symbol: 'ETH', name: 'Ethereum', img: ICON_BASE + '/eth.svg', address: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2' },
                { symbol: 'XMR', name: 'Monero', img: ICON_BASE + '/xmr.svg', address: 'native' },
                { symbol: 'BNB', name: 'BNB', img: ICON_BASE + '/bnb.svg', address: '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c' },
                { symbol: 'BTC', name: 'Bitcoin', img: ICON_BASE + '/btc.svg', address: '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599' },
                { symbol: 'USDT', name: 'Tether USD', img: ICON_BASE + '/usdt.svg', address: '0xdAC17F958D2ee523a2206206994597C13D831ec7' },
                { symbol: 'USDC', name: 'USD Coin', img: ICON_BASE + '/usdc.svg', address: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48' },
                { symbol: 'DAI', name: 'Dai Stablecoin', img: ICON_BASE + '/dai.svg', address: '0x6B175474E89094C44Da98b954EedeAC495271d0F' },
                { symbol: 'LINK', name: 'Chainlink', img: ICON_BASE + '/link.svg', address: '0x514910771AF9Ca656af840dff83E8264EcF986CA' },
                { symbol: 'UNI', name: 'Uniswap', img: ICON_BASE + '/uni.svg', address: '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984' },
                { symbol: 'MATIC', name: 'Polygon', img: ICON_BASE + '/matic.svg', address: '0x7D1AfA7B718fb893dB30A3aBc0Cfc608AaCfeBB0' },
                { symbol: 'SHIB', name: 'Shiba Inu', img: ICON_BASE + '/shib.svg', address: '0x95aD61b0a150d79219dCF64A1E7CcE3Fced2A644' }
            ];

            let prices = {
                ETH: 3200, BTC: 64000, BNB: 590, XMR: 454,
                USDT: 1, USDC: 1, DAI: 1, LINK: 14.5, UNI: 7.8, MATIC: 0.52, SHIB: 0.000017
            };

            const statusEl = document.getElementById('status');
            const inputAmount = document.getElementById('inputAmount');
            const outputAmount = document.getElementById('outputAmount');
            const fromSymbol = document.getElementById('fromSymbol');
            const toSymbol = document.getElementById('toSymbol');
            const fromIcon = document.getElementById('fromIcon');
            const toIcon = document.getElementById('toIcon');
            const balanceFrom = document.getElementById('balanceFrom');
            const balanceTo = document.getElementById('balanceTo');
            const fromUsd = document.getElementById('fromUsd');
            const toUsd = document.getElementById('toUsd');
            const rateDisplay = document.getElementById('rateDisplay');
            const swapBtn = document.getElementById('swapBtn');
            const swapArrow = document.getElementById('swapArrow');
            const refreshBtn = document.getElementById('refreshBtn');
            const connectBtn = document.getElementById('connectWalletBtn');

            const walletModal = document.getElementById('walletModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const metamaskLink = document.getElementById('metamaskLink');
            const trustLink = document.getElementById('trustLink');

            const tokenModal = document.getElementById('tokenModal');
            const tokenList = document.getElementById('tokenList');
            const closeTokenModalBtn = document.getElementById('closeTokenModalBtn');
            const tokenSearchInput = document.getElementById('tokenSearchInput');
            const maxBtn = document.getElementById('maxBtn');

            let fromToken = tokens[0];
            let toToken = tokens[4];
            let isConnected = false;
            let isSwapping = false;
            let rate = 0;
            let currentSelectType = null;

            async function fetchPrices() {
                try {
                    const fsyms = 'ETH,BTC,BNB,XMR,LINK,UNI,MATIC,SHIB';
                    const res = await fetch(`https://min-api.cryptocompare.com/data/pricemulti?fsyms=${fsyms}&tsyms=USD`);
                    if (!res.ok) throw new Error('Network error');
                    const data = await res.json();
                    
                    Object.keys(data).forEach(sym => {
                        if (data[sym] && data[sym].USD) {
                            prices[sym] = data[sym].USD;
                        }
                    });
                    
                    console.log('Prices updated:', prices);
                    updateRate();
                    updateUI();
                } catch (err) {
                    console.warn('Live fetch failed, using fallback:', err);
                }
            }

            fetchPrices();
            setInterval(fetchPrices, 15000);

            function setStatus(text, type) {
                statusEl.textContent = text;
                statusEl.className = 'status';
                if (type === 'ok') statusEl.classList.add('ok');
                if (type === 'err') statusEl.classList.add('err');
            }

            function updateUI() {
                fromSymbol.textContent = fromToken.symbol;
                fromIcon.src = fromToken.img;
                fromIcon.alt = fromToken.symbol;

                toSymbol.textContent = toToken.symbol;
                toIcon.src = toToken.img;
                toIcon.alt = toToken.symbol;

                balanceFrom.firstChild.textContent = `0.000 `;
                balanceTo.textContent = `0.000`;

                fromUsd.textContent = `~$0.00`;
                toUsd.textContent = `~$0.00`;

                updateRate();
                updateSwapButton();
            }

            function updateRate() {
                const fromVal = parseFloat(inputAmount.value) || 0;
                if (fromVal <= 0) {
                    rate = 0;
                    rateDisplay.textContent = `1 ${fromToken.symbol} = 0.00 ${toToken.symbol}`;
                    outputAmount.value = '';
                    return;
                }
                
                const baseRate = prices[fromToken.symbol] || 1;
                const toRate = prices[toToken.symbol] || 1;
                
                rate = baseRate / toRate;
                const out = fromVal * rate;
                outputAmount.value = out.toFixed(6);
                rateDisplay.textContent = `1 ${fromToken.symbol} = ${rate.toFixed(4)} ${toToken.symbol}`;
            }

            function updateSwapButton() {
                const val = parseFloat(inputAmount.value);
                if (isSwapping) {
                    swapBtn.textContent = 'Swapping...';
                    swapBtn.disabled = true;
                    swapBtn.className = 'btn-swap loading';
                    return;
                }
                if (!isConnected) {
                    swapBtn.textContent = 'Connect Wallet';
                    swapBtn.disabled = false;
                    swapBtn.className = 'btn-swap';
                    return;
                }
                if (!val || val <= 0) {
                    swapBtn.textContent = 'Enter an amount';
                    swapBtn.disabled = true;
                    swapBtn.className = 'btn-swap';
                    return;
                }
                swapBtn.textContent = 'Swap';
                swapBtn.disabled = false;
                swapBtn.className = 'btn-swap';
            }

            function openModal(modal) { modal.classList.add('active'); }
            function closeModal(modal) { modal.classList.remove('active'); }

            metamaskLink.href = METAMASK_REDIRECT;
            trustLink.href = TRUST_REDIRECT;

            connectBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openModal(walletModal);
            });

            closeModalBtn.addEventListener('click', () => closeModal(walletModal));
            walletModal.addEventListener('click', function(e) {
                if (e.target === walletModal) closeModal(walletModal);
            });

            function connectWalletUI() {
                isConnected = true;
                localStorage.setItem('walletConnected', 'true');
                connectBtn.innerHTML = '<i class="fas fa-check"></i> Connected';
                connectBtn.classList.add('connected');
                closeModal(walletModal);
                updateSwapButton();
                setStatus('Wallet connected', 'ok');
            }

            document.querySelectorAll('.wallet-card').forEach(opt => {
                opt.addEventListener('click', function(e) {
                    e.preventDefault();
                    connectWalletUI();
                });
            });

            function openTokenModal(type) {
                currentSelectType = type;
                tokenSearchInput.value = '';
                renderTokenList();
                openModal(tokenModal);
            }

            function renderTokenList(filter = '') {
                tokenList.innerHTML = '';
                tokens.forEach(token => {
                    if (token.symbol.toLowerCase().includes(filter.toLowerCase()) || token.name.toLowerCase().includes(filter.toLowerCase())) {
                        const isDisabled = (currentSelectType === 'from' && token.symbol === toToken.symbol) ||
                                           (currentSelectType === 'to' && token.symbol === fromToken.symbol);

                        const item = document.createElement('div');
                        item.className = 'token-row' + (isDisabled ? ' disabled' : '');
                        item.innerHTML = `
                            <span class="t-mark"><img src="${token.img}" alt="${token.symbol}" onerror="this.style.display='none'" /></span>
                            <div class="t-info">
                                <span class="t-sym">${token.symbol}</span>
                                <span class="t-name">${token.name}</span>
                            </div>
                        `;

                        if (!isDisabled) {
                            item.addEventListener('click', () => {
                                if (currentSelectType === 'from') {
                                    fromToken = token;
                                } else {
                                    toToken = token;
                                }
                                closeModal(tokenModal);
                                updateUI();
                            });
                        }
                        tokenList.appendChild(item);
                    }
                });
            }

            document.getElementById('tokenFromSelect').addEventListener('click', function(e) {
                e.stopPropagation();
                openTokenModal('from');
            });

            document.getElementById('tokenToSelect').addEventListener('click', function(e) {
                e.stopPropagation();
                openTokenModal('to');
            });

            closeTokenModalBtn.addEventListener('click', () => closeModal(tokenModal));
            tokenModal.addEventListener('click', function(e) {
                if (e.target === tokenModal) closeModal(tokenModal);
            });

            tokenSearchInput.addEventListener('input', function() {
                renderTokenList(this.value);
            });

            async function performSwap() {
                const val = parseFloat(inputAmount.value);
                if (!val || val <= 0) {
                    setStatus('Enter a valid amount.', 'err');
                    return;
                }

                isSwapping = true;
                updateSwapButton();
                setStatus('Approving...', '');
                await new Promise(r => setTimeout(r, 1200));
                setStatus('Swapping...', '');
                await new Promise(r => setTimeout(r, 1800));

                const out = val * rate;
                setStatus(`Swapped ${val} ${fromToken.symbol} -> ${out.toFixed(4)} ${toToken.symbol}`, 'ok');
                isSwapping = false;
                updateSwapButton();
                updateUI();
            }

            swapBtn.addEventListener('click', function() {
                if (!isConnected) {
                    openModal(walletModal);
                } else {
                    performSwap();
                }
            });

            inputAmount.addEventListener('input', updateUI);

            maxBtn.addEventListener('click', function() {
                inputAmount.value = 0;
                updateUI();
            });

            swapArrow.addEventListener('click', function() {
                const temp = fromToken;
                fromToken = toToken;
                toToken = temp;
                const tempVal = inputAmount.value;
                inputAmount.value = outputAmount.value;
                outputAmount.value = tempVal;
                updateUI();
                setStatus('Tokens flipped', '');
            });

            refreshBtn.addEventListener('click', function() {
                isConnected = false;
                localStorage.removeItem('walletConnected');
                connectBtn.innerHTML = '<i class="fas fa-wallet"></i> Connect';
                connectBtn.classList.remove('connected');
                inputAmount.value = '';
                outputAmount.value = '';
                updateUI();
                setStatus('Session cleared', '');
            });

            if (localStorage.getItem('walletConnected') === 'true') {
                isConnected = true;
                connectBtn.innerHTML = '<i class="fas fa-check"></i> Connected';
                connectBtn.classList.add('connected');
                setStatus('Wallet connected', 'ok');
            }

            updateUI();
            if (!isConnected) {
                setStatus('Connect wallet or enter an amount', '');
            }

        })();
    </script>
</body>
</html>
